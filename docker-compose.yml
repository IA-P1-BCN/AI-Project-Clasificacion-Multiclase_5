services:
  # Backend: FastAPI model-serving API (#34, #35, #37). Shares the image with
  # the frontend and overrides the command with uvicorn.
  api:
    build: .
    container_name: multiclass_api
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      # Mount source for local edits (restart the service to apply; no hot reload)
      - ./app:/app/app
      - ./src:/app/src
      - ./data:/app/data
      # Model artifact: read-only, the backend only serves it
      - ./models:/app/models:ro
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://app:app@db:3306/multiclass}
      MODEL_PATH: ${MODEL_PATH:-/app/models/model.joblib}
      # A/B test (#52): challenger model and share of the traffic sent to it (0 = disabled)
      MODEL_B_PATH: ${MODEL_B_PATH:-/app/models/model_b.joblib}
      AB_TRAFFIC_B: ${AB_TRAFFIC_B:-0}
      # Data drift monitoring (#53): window size, checks every N predictions (0 = off), optional alert webhook
      DRIFT_WINDOW: ${DRIFT_WINDOW:-500}
      DRIFT_CHECK_EVERY: ${DRIFT_CHECK_EVERY:-500}
      DRIFT_WEBHOOK_URL: ${DRIFT_WEBHOOK_URL:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # GET /health returns 200 even without a model or DB (#34 contract)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Frontend: Streamlit UI (app/main.py). Uses the image default command.
  app:
    build: .
    container_name: multiclass_app
    ports:
      - "8501:8501"
    volumes:
      # Mount source for local edits (restart the service to apply; no hot reload)
      - ./app:/app/app
      - ./src:/app/src
      - ./data:/app/data
      - ./models:/app/models
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://app:app@db:3306/multiclass}
      # Backend URL for the frontend; Compose resolves "api" to the api service
      API_URL: ${API_URL:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: multiclass_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-multiclass}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # TCP (127.0.0.1) so the socket-only bootstrap server of the first start does not count as healthy
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
