services:
  app:
    build: .
    container_name: multiclass_app
    ports:
      - "8501:8501"
    volumes:
      # Live-reload source during development
      - ./app:/app/app
      - ./src:/app/src
    env_file:
      - path: .env
        required: false
    # Uncomment once the DB service below is enabled
    # depends_on:
    #   - db
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Optional database service (enable when needed, e.g. M6 feedback/retraining).
